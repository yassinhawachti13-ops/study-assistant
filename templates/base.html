<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Study Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="{{ url_for('home') }}">Study Assistant</a>
        <nav aria-label="Main navigation">
          <a href="{{ url_for('solver') }}">Equation Solver</a>
          <a href="{{ url_for('exercises') }}">Exercise Library</a>
          <a href="{{ url_for('daily_log') }}">Daily Log</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
